# Deploy Firestore rules and indexes when backend config changes.
# Repository secret required: FIREBASE_TOKEN (from `firebase login:ci`).

name: Deploy Firebase

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check FIREBASE_TOKEN secret
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "${FIREBASE_TOKEN}" ]; then
            echo "::error::Missing repository secret FIREBASE_TOKEN."
            echo "Create it under Settings → Secrets and variables → Actions:"
            echo "  1. On your machine: npx firebase login:ci"
            echo "  2. Paste the token as secret name FIREBASE_TOKEN"
            echo "  3. Re-run this workflow"
            exit 1
          fi
          echo "FIREBASE_TOKEN is set (length ${#FIREBASE_TOKEN})."

      - name: Deploy Firestore
        run: npx firebase deploy --only firestore --non-interactive --project auto-repair-management
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
